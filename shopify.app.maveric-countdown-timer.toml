# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "913a8ca6f5cb34598fa3794dda5d2eb2"
name = "Maveric CountDown timer"
application_url = "https://countdown-timer-bar.vercel.app"
embedded = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,write_themes"

[auth]
redirect_urls = [ "https://countdown-timer-bar.vercel.app/auth/callback" ]

[app_proxy]
url = "https://countdown-timer-bar.vercel.app/apps/timer"
subpath = "timer"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
